name: BibleApp
options:
  bundleIdPrefix: com.bibleapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"

targets:
  BibleApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BibleApp
        excludes:
          - "Resources/bibles"
      - path: BibleApp/Resources/bibles
        type: folder    # preserve directory structure in the .app bundle
    info:
      path: BibleApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: BibleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibleapp.BibleApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
